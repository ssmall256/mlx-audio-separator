name: Release (GitHub)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already published to PyPI (for example: 0.1.16)"
        required: true
        type: string

concurrency:
  group: release-github-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ inputs.version }}
      NOTES_FILE: /tmp/release-notes.md
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate main ref and source version
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "GitHub releases must be dispatched from main" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["PACKAGE_VERSION"]
          actual = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if actual != expected:
              raise SystemExit(f"Requested {expected}, but pyproject.toml is {actual}")
          print(f"Validated main source version {actual}")
          PY

      - name: Confirm version exists on PyPI
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/mlx-audio-separator/{version}/json"
          payload = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code != 404 or attempt == 11:
                      raise
                  time.sleep(10)
          # info.version is a cached "latest" view and lags; the per-version
          # endpoint returning at all is what proves this version is published.
          if payload is None:
              raise SystemExit(f"mlx-audio-separator {version} is not available on PyPI")
          print(f"Confirmed mlx-audio-separator {version} on PyPI")
          PY

      - name: Reject existing tag or release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi

      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          source = Path("CHANGELOG.md")
          lines = source.read_text().splitlines()

          # Accept every heading style in use across these repos:
          # "## 1.2.3", "## v1.2.3", "## 1.2.3 - 2026-01-01", "## [1.2.3] - 2026-01-01".
          def is_heading(line):
              if not line.startswith("## "):
                  return False
              body = line[3:].strip()
              if not body:
                  return False
              return body.split()[0].strip("[]").lstrip("v") == version

          start = next(
              (index + 1 for index, line in enumerate(lines) if is_heading(line)),
              None,
          )
          if start is None:
              raise SystemExit(
                  f"Missing a '## {version}' section in {source}. "
                  "Add the release notes there before publishing."
              )

          end = next(
              (index for index in range(start, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f"No release notes found under the {version} heading")

          notes += (
              f"\n\nInstall:\n\n```bash\n"
              f"pip install -U mlx-audio-separator=={version}\n"
              f"```\n\n[View mlx-audio-separator {version} on PyPI]"
              f"(https://pypi.org/project/mlx-audio-separator/{version}/)\n"
          )
          Path(os.environ["NOTES_FILE"]).write_text(notes)
          print(notes)
          PY

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${PACKAGE_VERSION}" -m "Release v${PACKAGE_VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${PACKAGE_VERSION}"

      - name: Publish GitHub release
        run: |
          gh release create "v${PACKAGE_VERSION}" \
            --verify-tag \
            --title "v${PACKAGE_VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --latest
