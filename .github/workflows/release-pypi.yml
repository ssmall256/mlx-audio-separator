name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 0.2.0)"
        required: true
        type: string

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Set version from workflow input
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  smoke-macos:
    name: Smoke install from PyPI (macOS)
    runs-on: macos-14
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Wait for mlx-audio-separator on PyPI
        run: |
          python -m pip install --upgrade pip
          dist_dir="${RUNNER_TEMP}/mlx-audio-separator-dist"
          mkdir -p "${dist_dir}"
          # Up to 10 minutes: a freshly published file can take minutes to
          # reach every CDN mirror, and macOS runners hit stale ones often.
          for attempt in {1..60}; do
            if python -m pip download \
              --no-deps \
              --no-cache-dir \
              --only-binary :all: \
              --dest "${dist_dir}" \
              "mlx-audio-separator==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "mlx-audio-separator ${PACKAGE_VERSION} did not reach PyPI within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install the downloaded distribution
        run: |
          shopt -s nullglob
          dists=("${RUNNER_TEMP}/mlx-audio-separator-dist"/mlx_audio_separator-*)
          if [ "${#dists[@]}" -ne 1 ]; then
            echo "Expected exactly one mlx-audio-separator ${PACKAGE_VERSION} distribution, found ${#dists[@]}" >&2
            exit 1
          fi
          # The wait only proves this package has propagated; a freshly
          # published dependency can still be missing from the mirror pip
          # resolves against. A resolution failure costs nothing, so retry.
          for attempt in {1..8}; do
            if python -m pip install --no-cache-dir "${dists[0]}"; then
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "Could not install ${dists[0]}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test
        run: |
          python -c "
          import mlx_audio_separator
          print(f'mlx-audio-separator {mlx_audio_separator.__version__} import smoke passed')
          " 2>&1 | head -20
          mlx-audio-separator --version
