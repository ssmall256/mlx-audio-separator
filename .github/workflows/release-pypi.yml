name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 0.2.0)"
        required: true
        type: string

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Set version from workflow input
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Validate built version
        env:
          PACKAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["PACKAGE_VERSION"])
          built = set()
          for dist in sorted(Path("dist").iterdir()):
              if dist.name.endswith(".whl"):
                  built.add(parse_wheel_filename(dist.name)[1])
              elif dist.name.endswith(".tar.gz"):
                  built.add(parse_sdist_filename(dist.name)[1])
          if not built:
              raise SystemExit("No distributions were built")
          if built != {expected}:
              raise SystemExit(
                  f"Requested {expected}, but built {sorted(str(v) for v in built)}"
              )
          print(f"Validated built version {expected}")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  smoke-macos:
    name: Smoke install from PyPI (macOS)
    runs-on: macos-14
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve the published mlx-audio-separator artifact
        run: |
          # pip resolves against the PEP 691 JSON rendering of
          # /simple/<project>/. That rendering is cached separately from the
          # PEP 503 HTML one and the two can serve different snapshots of the
          # same URL, so a freshly published version may be invisible to pip
          # while every other view of PyPI already shows it. Ask the release
          # API for the file directly, which sits outside that split, and
          # install the artifact by URL.
          python - <<'PY' >> "${GITHUB_ENV}"
          import json
          import os
          import time
          import urllib.request

          name = "mlx-audio-separator"
          version = os.environ["PACKAGE_VERSION"]
          api = f"https://pypi.org/pypi/{name}/{version}/json"

          for _ in range(60):
              try:
                  with urllib.request.urlopen(api, timeout=30) as response:
                      files = json.load(response)["urls"]
              except Exception:
                  files = []
              for kind in ("bdist_wheel", "sdist"):
                  for entry in files:
                      if entry["packagetype"] == kind:
                          print(f"ARTIFACT_URL={entry['url']}")
                          raise SystemExit(0)
              time.sleep(10)

          raise SystemExit(
              f"{name} {version} did not reach PyPI within 10 minutes"
          )
          PY

      - name: Install mlx-audio-separator from the resolved artifact
        run: |
          python -m pip install --upgrade pip
          # The artifact URL is exact, but dependencies still resolve through
          # the index, so retry: a freshly published dependency can be missing
          # from the mirror pip reads. A resolution failure costs nothing.
          for attempt in {1..8}; do
            if python -m pip install --no-cache-dir \
              "${ARTIFACT_URL}"; then
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "Could not install ${ARTIFACT_URL}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test
        run: |
          python -c "
          import mlx_audio_separator
          print(f'mlx-audio-separator {mlx_audio_separator.__version__} import smoke passed')
          " 2>&1 | head -20
          mlx-audio-separator --version
