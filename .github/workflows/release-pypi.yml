name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 0.2.0)"
        required: true
        type: string

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  smoke-macos:
    name: Smoke install from PyPI (macOS)
    runs-on: macos-14
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          for i in {1..12}; do
            if wheel_url="$(python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = (
              "https://pypi.org/pypi/mlx-audio-separator/"
              f"{version}/json?cache_bust={time.time_ns()}"
          )
          with urllib.request.urlopen(url) as response:
              release = json.load(response)
          wheels = [item["url"] for item in release["urls"] if item["packagetype"] == "bdist_wheel"]
          if len(wheels) != 1:
              raise RuntimeError(f"Expected one wheel for {version}, found {len(wheels)}")
          print(wheels[0])
          PY
            )"; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          python -m pip install "$wheel_url"

      - name: Smoke test
        run: |
          python -c "
          import mlx_audio_separator
          print(f'mlx-audio-separator {mlx_audio_separator.__version__} import smoke passed')
          " 2>&1 | head -20
          mlx-audio-separator --version
